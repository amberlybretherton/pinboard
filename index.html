<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14202b"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><title>Pinboard</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.4 system-ui,sans-serif;color:#14202b;background:#eef2f4}
button,input,textarea{font:inherit}button{cursor:pointer}
#app{display:none;height:100%;flex-direction:column}
header{display:flex;gap:6px;align-items:center;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:#14202b;color:#fff}
header b{flex:1;font-size:18px}
@media(max-width:480px){header .b{padding:6px 10px;font-size:13px}}
.b{background:#14202b;color:#fff;border:0;border-radius:9px;padding:9px 13px;font-weight:600}
.b.g{background:none;color:#14202b;border:1px solid #c5d0d7}
header .b{background:#2a3b4a;padding:6px 10px;font-size:13px}
#bar{padding:8px 10px;background:#fff;border-bottom:1px solid #d6dee3}
#bar input,.in{width:100%;border:1px solid #d6dee3;border-radius:9px;padding:9px 11px;margin-bottom:8px}
#chips{display:flex;gap:6px;overflow-x:auto}
.chip{--c:#14202b;flex:none;border:1.5px solid var(--c);background:none;border-radius:99px;padding:3px 10px;font-size:13px}
.chip.on{background:var(--c);color:#fff}
#map{flex:1}
.mk{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45);color:#fff;font-size:13px;font-weight:700;text-align:center;line-height:22px;cursor:pointer}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:auto;max-height:85%;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.25);display:none;z-index:5}
#sheet h2{margin:0 0 8px;font-size:18px}
textarea.in{min-height:60px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid #d6dee3;border-radius:9px;overflow:hidden;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:8px}.seg .on{background:#14202b;color:#fff}
.mut{color:#5f6f7c;font-size:13px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#14202b;color:#fff;padding:8px 14px;border-radius:99px;font-size:13px;display:none;z-index:9}
#auth{max-width:340px;margin:12vh auto;padding:20px}
#auth h1{margin:0 0 14px}
</style></head><body>
<div id="auth"><h1>Pinboard</h1><p class="mut">Sign in to see your map.</p>
<input class="in" id="em" type="email" placeholder="Email" autocomplete="email">
<input class="in" id="pw" type="password" placeholder="Password (8+ characters)" autocomplete="current-password">
<div class="row"><button class="b" onclick="signIn()">Sign in</button><button class="b g" onclick="signUp()">Create account</button></div></div>
<div id="app"><header><b>Pinboard</b><button class="b" onclick="addSheet()">+ Pin</button><button class="b" onclick="discoverSheet()">Discover</button><button class="b" onclick="menuSheet()">Menu</button></header>
<div id="bar"><input id="q" placeholder="Search my pins" oninput="q=this.value;draw()"><div id="chips"></div></div>
<div id="map"></div></div>
<div id="sheet"></div><div id="toast"></div>
<script>
// Your keys live in config.js, so updating this file never touches them.

const db=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cats=[],pins=[],markers=[],map=null,filter=null,q='',cur=null,adding=false,user=null;

function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
async function signIn(){const r=await db.auth.signInWithPassword({email:$('em').value,password:$('pw').value});if(r.error)toast(r.error.message)}
async function signUp(){const r=await db.auth.signUp({email:$('em').value,password:$('pw').value});if(r.error)toast(r.error.message);else if(!r.data.session)toast('Check your email to confirm, then sign in')}
db.auth.onAuthStateChange((_e,s)=>{const id=s?.user?.id||null;if(id===user)return;user=id;id?start():stop()});
function stop(){$('auth').style.display='block';$('app').style.display='none';closeSheet()}
async function start(){$('auth').style.display='none';$('app').style.display='flex';
 if(!map){mapboxgl.accessToken=CFG.MAPBOX_TOKEN;map=new mapboxgl.Map({container:'map',style:'mapbox://styles/mapbox/streets-v12',center:[-98,39],zoom:3});
  map.addControl(new mapboxgl.NavigationControl(),'top-right');map.addControl(new mapboxgl.GeolocateControl({trackUserLocation:false}),'top-right');
  map.on('click',e=>{if(!adding)return;adding=false;map.getCanvas().style.cursor='';const d=pend||{};pend=null;openSheet({name:d.name||'',address:d.address||null,description:'',notes:'',status:'want',cids:d.cids||[],latitude:+e.lngLat.lat.toFixed(6),longitude:+e.lngLat.lng.toFixed(6),source_platform:d.plat||'manual'})})}
 await load()}
async function load(){const[c,p]=await Promise.all([db.from('categories').select('*').order('created_at'),db.from('pins').select('*,pin_categories(category_id)').order('created_at',{ascending:false})]);
 if(c.error||p.error)return toast((c.error||p.error).message);
 cats=c.data;pins=p.data.map(x=>({...x,cids:x.pin_categories.map(r=>r.category_id)}));chips();draw()}
const colorOf=id=>(cats.find(c=>c.id===id)||{color:'#888'}).color, nameOf=id=>(cats.find(c=>c.id===id)||{name:'?'}).name;
function chips(){$('chips').innerHTML=`<button class="chip ${!filter?'on':''}" onclick="filter=null;chips();draw()">All</button>`+cats.map(c=>`<button class="chip ${filter===c.id?'on':''}" style="--c:${c.color}" onclick="filter='${c.id}';chips();draw()">${esc(c.name)}</button>`).join('')}
function draw(){markers.forEach(m=>m.remove());markers=[];
 pins.filter(p=>(!filter||p.cids.includes(filter))&&(!q||(p.name+(p.description||'')+(p.notes||'')).toLowerCase().includes(q.toLowerCase()))).forEach(p=>{
  const cs=p.cids.map(colorOf),n=cs.length||1,el=document.createElement('div');el.className='mk';
  el.style.background=cs.length>1?`conic-gradient(${cs.map((c,i)=>`${c} ${i*100/n}% ${(i+1)*100/n}%`).join(',')})`:(cs[0]||'#888');
  if(p.status==='visited')el.textContent='✓';
  el.onclick=e=>{e.stopPropagation();openSheet(p)};
  markers.push(new mapboxgl.Marker(el).setLngLat([p.longitude,p.latitude]).addTo(map))})}
function startAdd(){adding=true;map.getCanvas().style.cursor='crosshair';toast('Tap the map where the place is')}

/* pin editor */
function openSheet(p){cur={...p,cids:[...p.cids]};sheet()}
function closeSheet(){$('sheet').style.display='none';cur=null}
function sheet(){const p=cur;$('sheet').style.display='block';$('sheet').innerHTML=`<h2>${p.id?'Edit pin':'New pin'}</h2>
<input class="in" placeholder="Place name" value="${esc(p.name)}" oninput="cur.name=this.value">
<textarea class="in" placeholder="Description" oninput="cur.description=this.value">${esc(p.description)}</textarea>
<div class="mut">Categories. Pick more than one for a split pin.</div>
<div class="row" style="margin:6px 0">${cats.map(c=>`<button class="chip ${p.cids.includes(c.id)?'on':''}" style="--c:${c.color}" onclick="tog('${c.id}')">${esc(c.name)}</button>`).join('')}</div>
<div class="seg"><button class="${p.status==='want'?'on':''}" onclick="cur.status='want';sheet()">Want to visit</button><button class="${p.status==='visited'?'on':''}" onclick="cur.status='visited';sheet()">Visited</button></div>
<textarea class="in" placeholder="My notes" oninput="cur.notes=this.value">${esc(p.notes)}</textarea>
<p class="mut">${p.address?esc(p.address)+' · ':''}${p.latitude.toFixed(4)}, ${p.longitude.toFixed(4)}${p.source_url?' · saved from a post':''}</p>
<div class="row"><button class="b" onclick="save()">Save</button><button class="b g" onclick="closeSheet()">Cancel</button>${p.id?'<button class="b g" onclick="del()">Delete</button>':''}</div>`}
function tog(id){const a=cur.cids,i=a.indexOf(id);i>=0?a.splice(i,1):a.push(id);sheet()}
async function save(){if(!cur.name.trim())return toast('Enter a name');
 const row={name:cur.name.trim(),address:cur.address||null,description:cur.description||null,notes:cur.notes||null,status:cur.status,latitude:cur.latitude,longitude:cur.longitude,source_url:cur.source_url||null,source_platform:cur.source_platform||null,updated_at:new Date().toISOString()};
 let id=cur.id,r;
 if(id)r=await db.from('pins').update(row).eq('id',id);else{r=await db.from('pins').insert(row).select('id').single();id=r.data?.id}
 if(r.error)return toast(r.error.message);
 await db.from('pin_categories').delete().eq('pin_id',id);
 if(cur.cids.length){const r2=await db.from('pin_categories').insert(cur.cids.map(c=>({pin_id:id,category_id:c})));if(r2.error)return toast(r2.error.message)}
 closeSheet();load();toast('Saved')}
async function del(){if(!confirm('Delete this pin?'))return;const r=await db.from('pins').delete().eq('id',cur.id);if(r.error)return toast(r.error.message);closeSheet();load()}

/* categories */
function catSheet(){$('sheet').style.display='block';$('sheet').innerHTML=`<h2>Categories</h2>${cats.map(c=>`<div class="row" style="justify-content:space-between;margin-bottom:6px"><span><i style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${c.color}"></i> ${esc(c.name)} <span class="mut">${pins.filter(p=>p.cids.includes(c.id)).length} pins</span></span>${c.is_default?'':`<button class="b g" onclick="delCat('${c.id}')">Delete</button>`}</div>`).join('')}
<h2 style="margin-top:14px">New category</h2><div class="row"><input class="in" id="cn" placeholder='e.g. "Whimsical"' style="flex:1;margin:0"><input type="color" id="cc" value="#14b8a6" style="width:44px;height:40px;border:0;padding:0"><button class="b" onclick="addCat()">Add</button></div>
<div class="row" style="margin-top:12px"><button class="b g" onclick="closeSheet()">Close</button></div>`}
async function addCat(){const n=$('cn').value.trim();if(!n)return toast('Name your category');const r=await db.from('categories').insert({name:n,color:$('cc').value});if(r.error)return toast(r.error.message);await load();catSheet()}
async function delCat(id){if(!confirm('Delete this category? Pins keep their other categories.'))return;const r=await db.from('categories').delete().eq('id',id);if(r.error)return toast(r.error.message);await load();catSheet()}

/* place search (Mapbox Search Box). You tap to confirm the exact spot, so the saved coordinates are your own. */
let pend=null,share=false,st,PR=[],DL=[];
function addSheet(){$('sheet').style.display='block';$('sheet').innerHTML=`<h2>Add a pin</h2><input class="in" id="ps" placeholder='Search a place, e.g. "ramen Tokyo"' oninput="clearTimeout(st);st=setTimeout(placeSearch,350)"><div id="pr"></div><div class="row"><button class="b g" onclick="closeSheet();startAdd()">Just tap the map</button><button class="b g" onclick="closeSheet()">Cancel</button></div>`;$('ps').focus()}
async function placeSearch(){const t=$('ps').value.trim();if(t.length<2)return;const c=map.getCenter();
 try{const r=await fetch(`https://api.mapbox.com/search/searchbox/v1/forward?q=${encodeURIComponent(t)}&limit=6&proximity=${c.lng},${c.lat}&access_token=${CFG.MAPBOX_TOKEN}`);const j=await r.json();PR=j.features||[];
 $('pr').innerHTML=PR.length?PR.map((f,i)=>`<button class="b g" style="width:100%;text-align:left;margin-bottom:6px" onclick="pickPlace(${i})"><b>${esc(f.properties.name)}</b><br><span class="mut">${esc(f.properties.full_address||f.properties.place_formatted||'')}</span></button>`).join(''):'<p class="mut">No results. Try adding a city name.</p>'}catch(e){toast('Search failed')}}
function pickPlace(i){const f=PR[i],[lng,lat]=f.geometry.coordinates;pend={name:f.properties.name,address:f.properties.full_address||f.properties.place_formatted||null};closeSheet();map.flyTo({center:[lng,lat],zoom:17});adding=true;map.getCanvas().style.cursor='crosshair';toast('Tap the exact spot to drop the pin')}

/* menu and sharing */
async function menuSheet(){const r=await db.from('profiles').select('share_saves').maybeSingle();share=!!r.data?.share_saves;menuDraw()}
function menuDraw(){$('sheet').style.display='block';$('sheet').innerHTML=`<h2>Menu</h2><div class="row" style="flex-direction:column;align-items:stretch"><button class="b g" onclick="catSheet()">Categories</button><button class="b g" onclick="exportData()">Export my pins</button><button class="b g" onclick="toggleShare()">Share my saves with Discover: <b>${share?'ON':'OFF'}</b></button><p class="mut" style="margin:0">When on, Discover can count your saved places. Others only ever see the place name, location, a total, and the standard categories. Never your name, notes, description or custom categories. A place appears only after several people save it.</p><button class="b g" onclick="db.auth.signOut()">Sign out</button><button class="b g" onclick="closeSheet()">Close</button></div>`}
async function toggleShare(){const r=await db.from('profiles').upsert({user_id:user,share_saves:!share});if(r.error)return toast(r.error.message);share=!share;menuDraw()}

/* discover */
function discoverSheet(){$('sheet').style.display='block';$('sheet').innerHTML=`<h2>Discover</h2><input class="in" id="dq" placeholder='Search, e.g. "Tokyo" or "cafe"' oninput="clearTimeout(st);st=setTimeout(runDisc,350)"><div id="dl"></div><button class="b g" onclick="closeSheet()">Close</button>`;runDisc()}
async function runDisc(){const r=await db.rpc('discover',{search:$('dq')?.value||'',lim:30});if(r.error)return toast(r.error.message);DL=r.data;
 $('dl').innerHTML=DL.length?DL.map((d,i)=>`<div style="border:1px solid #d6dee3;border-radius:12px;padding:10px;margin-bottom:8px"><b>${esc(d.place_name)}</b> <span class="mut">${d.save_count} saves</span><div class="mut">${esc(d.place_address||'')}</div><div class="row" style="margin:6px 0">${d.cats.map(n=>`<span class="chip on" style="--c:${(cats.find(c=>c.name===n)||{color:'#888'}).color}">${esc(n)}</span>`).join('')}</div><div class="row"><button class="b" onclick="discSave(${i})">Save pin</button><button class="b g" onclick="discShow(${i})">Show on map</button></div></div>`).join(''):'<p class="mut">Nothing here yet. A place shows up once enough people who opted in have saved it.</p>'}
function discSave(i){const d=DL[i];closeSheet();openSheet({name:d.place_name,address:d.place_address,description:'',notes:'',status:'want',cids:cats.filter(c=>d.cats.includes(c.name)).map(c=>c.id),latitude:d.lat,longitude:d.lng,source_platform:'discover'})}
function discShow(i){const d=DL[i];closeSheet();map.flyTo({center:[d.lng,d.lat],zoom:15})}

/* your data is yours: download it any time */
function exportData(){const gj={type:'FeatureCollection',features:pins.map(p=>({type:'Feature',geometry:{type:'Point',coordinates:[p.longitude,p.latitude]},properties:{name:p.name,description:p.description,notes:p.notes,status:p.status,categories:p.cids.map(nameOf),source_url:p.source_url,source_platform:p.source_platform,created_at:p.created_at}}))};
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(gj,null,1)],{type:'application/geo+json'}));a.download='my-pins.geojson';a.click()}
</script></body></html>
